name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Base path for project Pages
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - name: Write escort-sync.json from secrets
        env:
          ESCORT_URL: ${{ secrets.NEXT_PUBLIC_ESCORT_SYNC_URL }}
          ESCORT_KEY: ${{ secrets.NEXT_PUBLIC_ESCORT_SYNC_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          url = os.environ.get("ESCORT_URL") or ""
          key = (os.environ.get("ESCORT_KEY") or "").replace("$$", "$")
          with open("public/escort-sync.json", "w") as f:
              json.dump({"url": url, "key": key}, f)
          print("escort-sync.json url=", bool(url), "key_len=", len(key))
          PY
      - name: Static export without API routes
        run: rm -rf src/app/api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_ESCORT_SYNC_URL: ${{ secrets.NEXT_PUBLIC_ESCORT_SYNC_URL }}
          NEXT_PUBLIC_ESCORT_SYNC_KEY: ${{ secrets.NEXT_PUBLIC_ESCORT_SYNC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
